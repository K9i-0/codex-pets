<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>窓際族物語 | Codex Pet RPG</title>
    <meta name="description" content="新入社員がそば屋とやめ太郎に導かれ、Codex pets と一緒に窓際族物語を追体験する短編RPG。" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://k9i-0.github.io/codex-pets/madogiwa.html" />
    <meta property="og:site_name" content="Codex Pets" />
    <meta property="og:title" content="窓際族物語 | 新入社員が追体験する短編RPG" />
    <meta property="og:description" content="そば屋とやめ太郎に導かれ、窓際席から社内酒場までを歩くCodex pets短編RPG。" />
    <meta property="og:image" content="https://k9i-0.github.io/codex-pets/assets/og/madogiwa-og.png" />
    <meta property="og:image:secure_url" content="https://k9i-0.github.io/codex-pets/assets/og/madogiwa-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="窓際族物語のゲーム画面風プレビュー。そば屋、やめ太郎、新入社員が窓際席にいる。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="窓際族物語 | 新入社員が追体験する短編RPG" />
    <meta name="twitter:description" content="そば屋とやめ太郎に導かれ、窓際席から社内酒場までを歩くCodex pets短編RPG。" />
    <meta name="twitter:image" content="https://k9i-0.github.io/codex-pets/assets/og/madogiwa-og.png" />
    <meta name="theme-color" content="#101214" />
    <link rel="stylesheet" href="madogiwa.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-header">
        <div>
          <h1>窓際族物語</h1>
          <p>新入社員が、そば屋とやめ太郎と一緒に窓際族物語を追体験するRPG</p>
        </div>
        <nav>
          <a href="index.html">Codex Pet Run</a>
          <button id="newGameButton" type="button">New Game</button>
        </nav>
      </section>

      <section class="game-layout">
        <div class="stage-panel">
          <canvas id="rpgCanvas" width="960" height="540"></canvas>
          <section id="nameGate" class="name-gate" aria-labelledby="nameGateTitle">
            <form id="playerNameForm" class="name-card">
              <h2 id="nameGateTitle">窓際族物語</h2>
              <p id="gateSpeaker" class="name-speaker">プロローグ</p>
              <p id="gateLine" class="name-line">窓際席に配属された新入社員は、窓辺の青い影のそばに立つ人物を見つける。</p>
              <label id="nameLabel" class="hidden" for="playerNameInput">名前を教える</label>
              <div id="nameRow" class="name-row hidden">
                <input id="playerNameInput" name="playerName" type="text" maxlength="12" placeholder="例: 佐藤" autocomplete="name" />
                <button type="submit">OK</button>
              </div>
              <button id="startGameButton" class="start-button" type="button">Start</button>
              <button id="continueButton" class="continue-button hidden" type="button">Continue</button>
            </form>
          </section>
          <div class="mobile-pad" aria-label="mobile controls">
            <div class="dpad">
              <button type="button" data-key="up">↑</button>
              <button type="button" data-key="left">←</button>
              <button type="button" data-key="down">↓</button>
              <button type="button" data-key="right">→</button>
            </div>
            <div class="mobile-actions">
              <button class="talk-button" type="button" data-key="interact">Talk</button>
              <button class="guide-button" type="button" data-key="guide">Guide</button>
            </div>
          </div>
        </div>

        <aside class="side-panel">
          <div class="card status-card">
            <h2>Journey</h2>
            <div class="status-line">
              <span>Chapter</span>
              <strong id="progressText">--</strong>
            </div>
            <div class="status-line">
              <span>Mood</span>
              <strong id="moodText">--</strong>
            </div>
          </div>
          <div class="card">
            <h2>Quest</h2>
            <p id="questText"></p>
          </div>
          <div class="card">
            <h2>Inventory</h2>
            <ul id="inventoryList"></ul>
          </div>
          <div class="card">
            <h2>Controls</h2>
            <p>Move: WASD / Arrow keys / Tap<br />Talk: Space / Enter / 画面のTalk<br />Guide: G / 画面のGuide</p>
          </div>
          <div class="card save-card">
            <h2>Save</h2>
            <p id="saveText">未開始</p>
          </div>
        </aside>
      </section>

      <section id="dialogBox" class="dialog hidden" aria-live="polite">
        <strong id="speakerName"></strong>
        <p id="dialogText"></p>
        <button id="nextDialogButton" type="button">Next</button>
      </section>
    </main>

    <script src="madogiwa.js"></script>
  </body>
</html>
